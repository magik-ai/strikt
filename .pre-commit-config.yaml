repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict src
        entry: uv run mypy --strict src
        language: system
        pass_filenames: false
        files: ^src/
      - id: prompts-md
        name: PROMPTS.md in sync
        entry: uv run python scripts/build_prompts_md.py --check
        language: system
        pass_filenames: false
        files: ^(src/strikt/agent/prompts/|scripts/build_prompts_md.py|PROMPTS.md)
