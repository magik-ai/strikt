[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "strogo"
version = "0.1.0"
description = "Strogo: a one-window Telegram health coach on Claude (food, training, sleep, body, proactive)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ilya Chernyakov" }]
requires-python = ">=3.13"
# Version floors were verified against PyPI on 2026-09-03 (research/09-python-stack.md was not
# available when this file was written; the floors below are the latest releases seen on PyPI).
# TODO(pins): a later agent may tighten these to exact `==` pins once research/09 lands.
dependencies = [
  "aiogram>=3.31,<4",
  "anthropic>=1.3,<2",
  "openai>=3.7,<4",
  "sqlalchemy[asyncio]>=2.0.52,<3",
  "asyncpg>=0.31",
  "alembic>=1.19",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "apscheduler>=3.11,<4",
  "aiohttp>=3.14,<4",
  "pillow>=12.3",
  "pillow-heif>=1.6",
  "structlog>=26.1",
  "cryptography>=50",
  "httpx>=0.28",
  "python-dateutil>=2.9",
  "tzdata>=2025.2",
]

[project.scripts]
strogo = "strogo.app:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "aiosqlite>=0.22",
  "mypy>=2.3",
  "ruff>=0.16.5",
  "pre-commit>=4.3",
  "types-python-dateutil>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strogo"]

[tool.hatch.build.targets.sdist]
include = ["src/strogo", "migrations", "alembic.ini", "README.md", "LICENSE"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "migrations"]
extend-exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # bugbear
  "ASYNC",       # async pitfalls
  "RUF",         # ruff-specific
  "SIM",         # simplify
  "PL",          # pylint (subset via ignores below)
  "PT",          # pytest style
  "RET",         # return
  "TCH",         # type-checking imports
  "DTZ",         # naive datetime misuse
  "T20",         # no print
  "N",           # naming
  "C4",          # comprehensions
  "ISC",         # implicit string concat
  "PIE",
  "PERF",
]
ignore = [
  "PLR0913",  # too many arguments (repo functions mirror table columns)
  "PLR0912",  # too many branches
  "PLR0915",  # too many statements
  "PLR2004",  # magic values (nutrition/formatting constants are documented inline)
  "PLR0911",  # too many returns
  "PLC0415",  # import inside function (used deliberately for lazy tool-module imports)
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode: the card uses thin spaces and ▓░ on purpose
  "RUF012",   # mutable class attributes (pydantic/aiogram patterns)
  "ISC001",   # conflicts with the formatter
  "E501",     # handled by the formatter; long URLs in prompts/copy are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "DTZ", "PT011", "ASYNC", "N802"]
"scripts/**" = ["T20"]
"migrations/env.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["strogo"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
pretty = true
# pydantic v2 mypy plugin. SQLAlchemy 2.0 needs no plugin: the `Mapped[...]` declarative API is
# typed natively and the legacy sqlalchemy2-stubs/sqlalchemy.ext.mypy plugin is deprecated.
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["strogo"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pillow_heif.*", "apscheduler.*", "asyncpg.*", "aiosqlite.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:strogo.*",
]
markers = ["slow: marks tests as slow"]
