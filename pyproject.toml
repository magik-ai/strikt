[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "strikt"
version = "0.1.0"
description = "Strikt: a one-window Telegram health coach on Claude (food, training, sleep, body, proactive)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ilya Chernyakov" }]
requires-python = ">=3.13"
# Exact pins from research/09-python-stack.md §1.1 (verified on PyPI 2026-09-03). Every compiled
# dependency ships cp314 Linux wheels, so the Docker image can stay on python:3.14-slim.
dependencies = [
  "anthropic==1.3.0",               # 1.x SDK, built on httpx2 (not httpx)
  "aiogram==3.31.0",                # Bot API 10.3, aiohttp-based
  "sqlalchemy[asyncio]==2.0.52",    # not 2.1 (pre-release only)
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "pydantic==2.13.5",               # aiogram requires pydantic<2.14
  "pydantic-settings==2.15.0",
  "apscheduler==3.11.3",            # 4.x is still alpha
  "pillow==12.3.0",
  "pillow-heif==1.6.0",             # HEIC only; AVIF is native in Pillow
  "structlog==26.1.0",
  "cryptography==50.0.1",
  "aiohttp==3.14.3",                # aiogram requires aiohttp<3.15
  "openai==3.7.0",                  # transcription only; also built on httpx2
  "uvloop==0.22.1; sys_platform != 'win32'",
  "httpx==0.28.1",                  # food DB clients (OFF/USDA); coexists with httpx2
  "python-dateutil==2.9.0.post0",
  "tzdata==2026.3",                 # IANA zones inside the slim image
]

[project.scripts]
strikt = "strikt.app:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",          # requires pytest>=8.4,<10
  "aiosqlite==0.22.1",              # unit tests run on SQLite
  "mypy==2.3.1",
  "ruff==0.16.5",
  "pre-commit==4.6.2",
  "types-python-dateutil==2.9.0.20260807",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strikt"]

[tool.hatch.build.targets.sdist]
include = ["src/strikt", "migrations", "alembic.ini", "README.md", "LICENSE"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "migrations"]
extend-exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # bugbear
  "ASYNC",       # async pitfalls
  "RUF",         # ruff-specific
  "SIM",         # simplify
  "PL",          # pylint (subset via ignores below)
  "PT",          # pytest style
  "RET",         # return
  "DTZ",         # naive datetime misuse
  "T20",         # no print
  "N",           # naming
  "C4",          # comprehensions
  "ISC",         # implicit string concat
  "PIE",
  "PERF",
]
ignore = [
  "PLR0913",  # too many arguments (repo functions mirror table columns)
  "PLR0912",  # too many branches
  "PLR0915",  # too many statements
  "PLR2004",  # magic values (nutrition/formatting constants are documented inline)
  "PLR0911",  # too many returns
  "PLR0917",  # too many positional arguments
  "PLC0415",  # import inside function (used deliberately for lazy tool-module imports)
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode: the card uses thin spaces and ▓░ on purpose
  "RUF012",   # mutable class attributes (pydantic/aiogram patterns)
  "ISC001",   # conflicts with the formatter
  "E501",     # handled by the formatter; long URLs in prompts/copy are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "DTZ", "PT011", "PT018", "ASYNC", "N802"]
"scripts/**" = ["T20"]
"migrations/env.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["strikt"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
show_error_codes = true
pretty = true
# pydantic v2 mypy plugin. SQLAlchemy 2.0 needs no plugin: the `Mapped[...]` declarative API is
# typed natively and the legacy sqlalchemy2-stubs/sqlalchemy.ext.mypy plugin is deprecated.
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["strikt"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pillow_heif.*", "apscheduler.*", "asyncpg.*", "aiosqlite.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:strikt.*",
]
markers = ["slow: marks tests as slow"]
